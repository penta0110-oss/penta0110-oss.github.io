:root{
  --pink:#FF7EB3;--pink2:#FFE3EF;--sky:#5CC8FF;--yellow:#FFD23F;--mint:#3DD598;--purple:#9C7BFF;--orange:#FF9F45;
  --ink:#4A3456;--sub:#86708F;--card:#FFFFFFEE;
  --u:min(1vw,4.8px);           /* 화면 폭 기준 단위 (최대 480px 폭) */
  --safeT:env(safe-area-inset-top);--safeB:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#FFEAF4,#E6F6FF 55%,#EAFBE6);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input,textarea{font-family:inherit;}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.5}
#app{position:relative;max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(8px + var(--safeT)) calc(3*var(--u)) calc(16px + var(--safeB));display:flex;flex-direction:column;gap:calc(2.4*var(--u))}

/* 상단바 */
.top{display:flex;align-items:center;gap:calc(1.6*var(--u));position:sticky;top:0;z-index:30;padding:calc(1.6*var(--u));
  background:#FFFFFFE6;border-radius:calc(5*var(--u));box-shadow:0 4px 14px #b48fc030;backdrop-filter:blur(6px)}
.top .ttl{flex:1;font-size:calc(4*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:calc(10*var(--u));height:calc(10*var(--u));min-width:40px;min-height:40px;border-radius:calc(3.4*var(--u));background:#F6E3FA;font-size:calc(5*var(--u));display:grid;place-items:center;box-shadow:0 3px 0 #E5C6EC}
.ic:active{transform:translateY(2px);box-shadow:0 1px 0 #E5C6EC}
.coin{background:#FFF4C4;border-radius:999px;padding:calc(1.4*var(--u)) calc(2.6*var(--u));font-size:calc(3.8*var(--u));white-space:nowrap;box-shadow:0 2px 0 #F0D78A}
.coin.st{background:#EEE3FF;box-shadow:0 2px 0 #D4C1F5}
.coin.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.3)}}

/* 공통 */
.card{background:var(--card);border-radius:calc(5.5*var(--u));padding:calc(3.6*var(--u));box-shadow:0 6px 18px #b8a6c32c;border:2px solid #fff}
.h1{font-size:calc(7*var(--u));text-align:center;color:#8152A3;margin:calc(1*var(--u)) 0;text-shadow:1px 2px #fff}
.h2{font-size:calc(5.4*var(--u));text-align:center;color:#8152A3;margin:0}
.sub{font-size:calc(3.6*var(--u));color:var(--sub);text-align:center;line-height:1.45}
.row{display:flex;align-items:center;gap:calc(2*var(--u))}.grow{flex:1}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:calc(15*var(--u));padding:calc(2.6*var(--u));border-radius:calc(5*var(--u));
  font-size:calc(5*var(--u));background:linear-gradient(#FFF0A0,#FFC745);box-shadow:0 calc(1.4*var(--u)) 0 #DB9C2F;border:2px solid #fff;color:#5E3E22}
.btn small{font-size:calc(3*var(--u));opacity:.85}
.btn .em{font-size:calc(8*var(--u));line-height:1}
.btn:active{transform:translateY(calc(1*var(--u)));box-shadow:0 2px 0 #DB9C2F}
.btn.pink{background:linear-gradient(#FFDDEE,#FF9CC9);box-shadow:0 calc(1.4*var(--u)) 0 #D9709F;color:#6B2A4A}
.btn.blue{background:linear-gradient(#D6F3FF,#7DCFFF);box-shadow:0 calc(1.4*var(--u)) 0 #4AA6D8;color:#1E4E6E}
.btn.green{background:linear-gradient(#E3FFD2,#8FE09B);box-shadow:0 calc(1.4*var(--u)) 0 #57B36B;color:#245C33}
.btn.purple{background:linear-gradient(#EFE2FF,#B796FF);box-shadow:0 calc(1.4*var(--u)) 0 #8A68DD;color:#3E2470}
.btn.white{background:#fff;box-shadow:0 calc(1.4*var(--u)) 0 #E7D3E2}
.btn.sm{min-height:0;width:auto;padding:calc(2*var(--u)) calc(3.6*var(--u));font-size:calc(3.8*var(--u))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(2.6*var(--u))}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2.2*var(--u))}
.bar{height:calc(3.4*var(--u));min-height:12px;border-radius:99px;background:#EEE2F1;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD06D,#FF89B2);transition:width .5s}
.bar.g>i{background:linear-gradient(90deg,#7BE495,#3DD598)}
.foot{text-align:center;font-size:11px;color:#A796B3;margin-top:auto;padding-top:8px}

.stage.tall{height:min(86vw,410px,52dvh)}
.stage .actor{position:absolute;bottom:4%;transform:translateX(-50%);transition:left 2.2s linear;will-change:left}
.stage .actor.fast{transition-duration:1.1s}
.stage .yeonA{width:34%;max-width:170px}
.stage .bubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:6px 12px;font-size:calc(3.6*var(--u));white-space:nowrap;box-shadow:0 3px 0 #0001;z-index:5;animation:pop .35s}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.stage .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,#7cc96a55)}
.flip{transform:scaleX(-1)}
.decoE{position:absolute;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(0 3px 2px #0003);pointer-events:none}
.friendE{position:absolute;bottom:6%;font-size:calc(7*var(--u));transition:left 3s ease-in-out;animation:hop 1.4s ease-in-out infinite;filter:drop-shadow(0 3px 2px #0003)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* 판다 */
.pandaW{position:absolute;bottom:3%;transform:translateX(-50%);transition:left 2.6s linear;cursor:pointer;z-index:3}
.pandaW .pi{display:block;height:100%;width:auto;transform-origin:50% 100%}
.pandaW .flipper{height:100%;transition:transform .2s}
.pandaW .flipper.left{transform:scaleX(-1)}
.pandaW.s0{height:34%}.pandaW.s1{height:48%}.pandaW.s2{height:60%}.pandaW.s3{height:72%}
.stage:not(.tall) .pandaW.s0{height:30%}.stage:not(.tall) .pandaW.s1{height:42%}.stage:not(.tall) .pandaW.s2{height:52%}.stage:not(.tall) .pandaW.s3{height:62%}
.pandaW.idle .pi{animation:pBreath 2.6s ease-in-out infinite}
.pandaW.walk .pi{animation:pWalk .5s ease-in-out infinite}
.pandaW.happy .pi{animation:pHop .5s cubic-bezier(.3,.7,.4,1) 2}
.pandaW.eat .pi{animation:pChew .32s ease-in-out infinite}
.pandaW.sleep .pi{animation:pSleep 3s ease-in-out infinite;filter:saturate(.75) brightness(.95)}
@keyframes pBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes pWalk{0%,100%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-6%) rotate(0)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-6%) rotate(0)}}
@keyframes pHop{0%{transform:scale(1,1)}20%{transform:scale(1.12,.86)}50%{transform:translateY(-22%) scale(.94,1.08)}80%{transform:scale(1.08,.92)}100%{transform:scale(1,1)}}
@keyframes pChew{0%,100%{transform:scale(1,1) rotate(0)}50%{transform:scale(1.05,.94) rotate(-2deg)}}
@keyframes pSleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.zz{position:absolute;right:-6%;top:-4%;font-size:calc(6*var(--u));color:#7A6CB0;animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-24px) scale(1.1)}}
.crumb{position:absolute;width:7px;height:7px;border-radius:2px;background:#6BC46A;pointer-events:none;z-index:6;animation:crumb .8s ease-out forwards}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.flyFood{position:fixed;z-index:80;font-size:calc(9*var(--u));pointer-events:none;transition:left .7s cubic-bezier(.3,-.4,.6,1),top .7s cubic-bezier(.4,-.8,.6,1),transform .7s}
.fx{position:fixed;z-index:85;pointer-events:none;font-size:calc(7*var(--u));animation:fxUp 1s ease-out forwards}
@keyframes fxUp{to{transform:translateY(-70px) scale(1.4);opacity:0}}
.stageBadges{display:flex;justify-content:space-between;gap:calc(1.4*var(--u))}
.stageBadges div{flex:1;text-align:center;font-size:calc(3*var(--u));color:var(--sub);opacity:.5}
.stageBadges div.on{opacity:1;color:#8152A3}
.stageBadges img{height:calc(13*var(--u));display:block;margin:0 auto 2px;filter:grayscale(1)}
.stageBadges div.on img{filter:none;transform:scale(1.1)}
.stageBadges div.done img{filter:none}

/* 성장 축하 */
.growfx{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:radial-gradient(circle,#FFF6C8 0,#FFB8D9 45%,#7B56C9 100%);overflow:hidden}
.growfx .rays{position:absolute;width:220vmax;height:220vmax;background:repeating-conic-gradient(#fff6 0 8deg,transparent 8deg 22deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.growfx .box{position:relative;text-align:center;color:#fff;text-shadow:0 3px 8px #5a2d7a}
.growfx .old,.growfx .new{height:min(48vw,240px);display:block;margin:0 auto}
.growfx .old{animation:oldOut 1.6s ease-in forwards}
.growfx .new{display:none;animation:newIn 1s cubic-bezier(.2,1.6,.4,1) forwards}
.growfx.reveal .old{display:none}.growfx.reveal .new{display:block}
@keyframes oldOut{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.08)}50%{transform:scale(.95)}70%{transform:scale(1.12)}100%{transform:scale(.4);filter:brightness(6);opacity:.2}}
@keyframes newIn{from{transform:scale(.2) rotate(-10deg);filter:brightness(4)}to{transform:scale(1) rotate(0);filter:brightness(1)}}
.growfx .flash{position:absolute;inset:0;background:#fff;opacity:0}
.growfx.reveal .flash{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.growfx .t1{font-size:calc(8*var(--u));margin-top:10px;opacity:0}.growfx.reveal .t1{animation:rise .6s .3s forwards}
.growfx .t2{font-size:calc(4.6*var(--u));opacity:0}.growfx.reveal .t2{animation:rise .6s .5s forwards}
.growfx .gbtn{opacity:0;margin-top:14px}.growfx.reveal .gbtn{animation:rise .5s 1s forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 지도 */
.vlist{display:flex;flex-direction:column;gap:calc(2.6*var(--u))}
.vcard{display:flex;align-items:center;gap:calc(3*var(--u));padding:calc(3*var(--u));border-radius:calc(5*var(--u));background:#fff;border:3px solid var(--c);box-shadow:0 calc(1.2*var(--u)) 0 var(--c);text-align:left;width:100%}
.vcard:nth-child(odd){margin-right:calc(5*var(--u));width:calc(100% - 5*var(--u))}
.vcard:nth-child(even){margin-left:calc(5*var(--u));width:calc(100% - 5*var(--u))}
.vcard .vi{width:calc(14*var(--u));height:calc(14*var(--u));border-radius:calc(4*var(--u));display:grid;place-items:center;font-size:calc(8*var(--u));background:var(--bg)}
.vcard b{font-weight:400;font-size:calc(5*var(--u));color:var(--c)}
.vcard .vs{font-size:calc(3.3*var(--u));color:var(--sub)}
.vcard.lock{filter:grayscale(1);opacity:.55}
.vcard .fr{font-size:calc(7*var(--u))}

/* 주문서 */
.spells{display:grid;grid-template-columns:1fr 1fr;gap:calc(2*var(--u))}
.spell{background:#fff;border-radius:calc(3.6*var(--u));padding:calc(2*var(--u));font-size:calc(5.4*var(--u));box-shadow:0 3px 0 #F1D2DF;display:flex;justify-content:center;gap:6px}
.spell .a{min-width:2.2em;border-radius:8px;background:var(--pink2);color:var(--pink)}
.spell.hid .a{background:var(--purple);color:transparent;position:relative}
.spell.hid .a:after{content:'?';position:absolute;inset:0;color:#fff}

/* 문제 */
.qhead{display:flex;align-items:center;gap:calc(2*var(--u))}
.qdots{display:flex;gap:calc(1.6*var(--u));flex:1;justify-content:center}
.qdots i{width:calc(4.4*var(--u));height:calc(4.4*var(--u));border-radius:50%;background:#fff;box-shadow:inset 0 2px 0 #EEDDE7}
.qdots i.on{background:var(--yellow);box-shadow:0 0 0 3px #FFF1B8}
.qstage{display:flex;align-items:flex-end;gap:calc(1*var(--u));min-height:calc(44*var(--u))}
.qstage .yw{width:31%;flex:0 0 auto}
.qbub{position:relative;flex:1;min-width:0;background:#fff;border-radius:calc(6*var(--u));padding:calc(3*var(--u));box-shadow:0 6px 0 #F1D2DF;text-align:center;margin-bottom:calc(8*var(--u))}
.qbub:before{content:'';position:absolute;left:-12px;bottom:28px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.qbub.gold{background:linear-gradient(#FFFBE0,#FFEFA8);box-shadow:0 6px 0 #EBC352,0 0 22px #FFD23F}
.qbub.gold:before{border-right-color:#FFF6CC}
.qtag{font-size:calc(3.4*var(--u));color:var(--purple)}
.qtxt{font-size:calc(11*var(--u));line-height:1.15;white-space:nowrap}
.qtxt.ch,.qtxt.pd{font-size:calc(9.4*var(--u))}
.qtxt .qm{color:var(--pink)}
.groups{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px 0}
.groups .gp{display:flex;flex-wrap:wrap;gap:2px;max-width:calc(16*var(--u));padding:3px;border:2px dashed #EDB6D6;border-radius:8px}
.groups .gp i{width:calc(2.2*var(--u));height:calc(2.2*var(--u));min-width:8px;min-height:8px;border-radius:50%;background:#F59AC3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(3*var(--u))}
.opt{height:calc(20*var(--u));min-height:64px;border-radius:calc(6*var(--u));font-size:calc(9*var(--u));color:#fff;text-shadow:0 2px 0 #0002;
  background:radial-gradient(circle at 28% 24%,#fff9 0 11%,transparent 12%),var(--c);box-shadow:inset -6px -8px 0 #0001,0 calc(1.4*var(--u)) 0 #0002}
.opt:active{transform:translateY(3px)}
.opt.ok{animation:okPop .45s ease forwards}
@keyframes okPop{50%{transform:scale(1.12)}100%{transform:scale(1.04);box-shadow:0 0 0 5px #FFF3A8,0 0 24px 8px #FFE66D}}
.opt.no{animation:shake .4s;filter:grayscale(.8);opacity:.5}
.opt.hint{outline:4px solid var(--mint);outline-offset:3px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2.2*var(--u))}
.key{height:calc(14*var(--u));min-height:50px;border-radius:calc(4*var(--u));background:#fff;font-size:calc(7*var(--u));box-shadow:0 calc(1.2*var(--u)) 0 #E8D3DE}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #E8D3DE}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 calc(1.2*var(--u)) 0 #24A774;font-size:calc(5.4*var(--u))}
.key.del{background:#FFE8D6}
.inbox{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--pink);color:var(--pink)}
.explain{font-size:calc(4.6*var(--u))}
.explain b{color:var(--pink);font-weight:400}
.burst{position:fixed;z-index:90;pointer-events:none;font-size:calc(5*var(--u));animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* 보물상자 */
.chest{font-size:calc(30*var(--u));text-align:center;line-height:1;animation:chestIn .8s cubic-bezier(.2,1.5,.4,1)}
.chest.open{animation:chestOpen .6s ease forwards}
@keyframes chestIn{from{transform:scale(0) rotate(-20deg)}}
@keyframes chestOpen{40%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1.1)}}
.pick{background:#fff;border-radius:calc(5*var(--u));padding:calc(3*var(--u)) 4px;border:3px solid #FFE1EC;box-shadow:0 calc(1.4*var(--u)) 0 #EED6E1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(3.6*var(--u))}
.pick .e{font-size:calc(11*var(--u));line-height:1}
.pick.on{border-color:var(--yellow);background:#FFFBEA;transform:scale(1.05)}

/* 상점 */
.tabs{display:flex;gap:calc(1.4*var(--u));overflow-x:auto;scrollbar-width:none}
.tab{flex:1;white-space:nowrap;padding:calc(2.2*var(--u)) calc(2.4*var(--u));border-radius:99px;background:#fff;font-size:calc(3.8*var(--u));box-shadow:0 3px 0 #EED6E1}
.tab.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #D9709F}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2.2*var(--u))}
.item{background:#fff;border-radius:calc(4*var(--u));padding:calc(2.4*var(--u)) 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:calc(3.4*var(--u));box-shadow:0 calc(1.2*var(--u)) 0 #EED6E1;border:3px solid transparent}
.item .e{font-size:calc(9*var(--u));line-height:1.1}
.item .pr{font-size:calc(3.2*var(--u));color:var(--orange)}
.item.on{border-color:var(--mint)}.item.on .pr{color:var(--mint)}
.item .ev{font-size:calc(2.8*var(--u));color:#fff;background:#FF6B8A;border-radius:99px;padding:0 6px}
.dressing{position:relative;height:min(78vw,370px,44dvh);border-radius:calc(6*var(--u));background:radial-gradient(circle at 50% 80%,#fff 0,#FFE6F2 40%,#DDEBFF 100%);overflow:hidden;border:3px solid #fff;box-shadow:0 6px 18px #b8a6c340}
.dressing .yw{position:absolute;left:50%;bottom:2%;height:96%;transform:translateX(-50%)}
.dressing .yw svg{height:100%;width:auto}
.dressing .spot{position:absolute;left:50%;bottom:0;width:60%;height:12%;transform:translateX(-50%);background:radial-gradient(ellipse,#fff 0,#fff0 70%)}

/* 챌린지 */
.cdown{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:#4A345688;font-size:calc(40*var(--u));color:#fff;text-shadow:0 6px 0 #8152A3}
.cdown span{animation:cd 1s ease-out}
@keyframes cd{from{transform:scale(2.2);opacity:0}}
.timer{flex:1;height:calc(4*var(--u));min-height:14px;border-radius:99px;background:#fff;overflow:hidden;box-shadow:inset 0 2px 0 #EEDDE7}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px}
.timer.low i{background:linear-gradient(90deg,#FF6B6B,var(--orange))}
.combo{font-size:calc(4.4*var(--u));color:var(--orange);min-height:1.3em;text-align:center}

/* 미니게임 */
.mg{position:relative;height:min(118vw,560px,62dvh);border-radius:calc(6*var(--u));overflow:hidden;background:linear-gradient(#BDEBFF,#E8F9FF 60%,#9FE09A 60%,#7CCB7A);border:3px solid #fff;touch-action:none}
.mg .catcher{position:absolute;bottom:3%;height:26%;transform:translateX(-50%);pointer-events:none}
.mg .catcher img{height:100%}
.mg .drop{position:absolute;font-size:calc(9*var(--u));transform:translate(-50%,-50%);pointer-events:none}
.mg .hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:calc(4.6*var(--u));z-index:3}
.mg .hud span{background:#fffd;border-radius:99px;padding:4px 10px}

/* 스티커 / 출석 */
.stickers{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(2*var(--u))}
.stk{background:#fff;border-radius:calc(4*var(--u));padding:calc(2*var(--u)) 2px;text-align:center;font-size:calc(2.8*var(--u));color:var(--sub);box-shadow:0 3px 0 #EED6E1}
.stk .e{font-size:calc(9*var(--u));display:block;line-height:1.2}
.stk.lock .e{filter:grayscale(1) brightness(1.6);opacity:.35}
.stk.new{animation:okPop .6s 2 alternate}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(1.4*var(--u))}
.stamp{aspect-ratio:1;border-radius:50%;background:#fff;border:2px dashed #EAB8D2;display:grid;place-items:center;font-size:calc(3*var(--u));position:relative}
.stamp b{font-weight:400;font-size:calc(5.4*var(--u))}
.stamp.got{background:#FFE5F0;border-style:solid}
.stamp.got:after{content:'🐾';position:absolute;font-size:calc(7*var(--u));animation:stampIn .4s}
.stamp.today{border-color:var(--pink);border-width:3px}
@keyframes stampIn{from{transform:scale(2.4) rotate(-25deg);opacity:0}}

/* 배너/이벤트 */
.banners{display:flex;flex-direction:column;gap:calc(2*var(--u))}
.banner{display:flex;align-items:center;gap:calc(2.4*var(--u));padding:calc(2.6*var(--u)) calc(3.4*var(--u));border-radius:calc(5*var(--u));background:linear-gradient(90deg,#FFF3C4,#FFDDEE);border:2px solid #fff;box-shadow:0 4px 0 #EFCF9A;font-size:calc(3.8*var(--u));text-align:left;width:100%}
.banner .e{font-size:calc(8*var(--u))}
.banner.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 4px 0 #EFCF9A,0 0 18px #FFC74A}}
.visitor{position:absolute;right:6%;bottom:8%;font-size:calc(10*var(--u));z-index:6;animation:visitIn 1.2s cubic-bezier(.2,1.4,.4,1),hop 1.2s 1.2s ease-in-out infinite;cursor:pointer}
.visitor:after{content:'🎁';position:absolute;right:-12px;top:-10px;font-size:calc(5*var(--u))}
@keyframes visitIn{from{transform:translateX(120%)}}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.snow i{position:absolute;top:-10px;color:#fff;font-style:normal;animation:snow linear infinite}
@keyframes snow{to{transform:translate(20px,110vh) rotate(180deg)}}

/* 모달 */
.modalW{position:fixed;inset:0;z-index:100;background:#3a2547a6;display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);max-height:88dvh;overflow:auto;background:#FFF9FF;border:4px solid #fff;border-radius:calc(7*var(--u));padding:calc(5*var(--u));text-align:center;display:flex;flex-direction:column;gap:calc(2.6*var(--u));animation:modalIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes modalIn{from{transform:scale(.7);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safeB));transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:calc(4*var(--u));z-index:130;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:140;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 마을 첫 클리어 특별 연출 */
.clear{position:fixed;inset:0;z-index:115;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(24px + var(--safeB))}
.clear .layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.clear .ttl{position:absolute;top:calc(8% + var(--safeT));left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;padding:10px 22px;border-radius:99px;background:linear-gradient(135deg,#FFE27A,#FFA6CC);border:3px solid #fff;font-size:calc(6.4*var(--u));color:#6D2E50;box-shadow:0 6px 20px #0003;animation:ttlIn .8s cubic-bezier(.2,1.5,.4,1) both;z-index:5}
@keyframes ttlIn{from{transform:translate(-50%,-140px) scale(.6)}}
.clear .cast{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4%;width:100%;max-width:440px;height:42dvh;z-index:4}
.clear .cast .yw{height:100%;width:auto}.clear .cast .yw svg{height:100%;width:auto}
.clear .cast .pw{height:62%}.clear .cast .pw img{height:100%;animation:pHop .6s cubic-bezier(.3,.7,.4,1) infinite}
.clear .friend{position:absolute;z-index:5;font-size:calc(22*var(--u));filter:drop-shadow(0 8px 6px #0004)}
.clear .msg{position:relative;z-index:6;background:#fffe;border-radius:calc(5*var(--u));padding:12px 16px;text-align:center;margin-top:10px;width:100%;max-width:440px;animation:rise .6s 1.2s both}
.clear .msg b{font-weight:400;font-size:calc(5.6*var(--u));color:#8152A3}
.clear .msg p{margin:4px 0 10px;font-size:calc(3.8*var(--u));color:var(--sub)}
.p{position:absolute;pointer-events:none;line-height:1}
/* 2단 대나무 숲 */
.th-forest{background:linear-gradient(#BFF0C4,#E9FFD9 60%,#7FCB75)}
.th-forest .bam{position:absolute;bottom:0;width:4%;border-radius:8px 8px 0 0;background:repeating-linear-gradient(#7BCB62 0 46px,#4E9E44 46px 50px);transform-origin:bottom;animation:bamGrow 1.4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes bamGrow{from{transform:scaleY(0)}}
.th-forest .leaf{animation:leafFall linear infinite}
@keyframes leafFall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.th-forest .friend{animation:rabbitHop 2.6s ease-in-out both}
@keyframes rabbitHop{0%{left:-20%;bottom:56%}20%{bottom:72%}35%{left:20%;bottom:56%}55%{bottom:72%}70%{left:62%;bottom:56%;}85%{bottom:66%}100%{left:66%;bottom:58%}}
/* 3단 연못 */
.th-pond{background:linear-gradient(#BDEBFF,#8FD8FF 50%,#4FB2E8)}
.th-pond .ring{position:absolute;border:3px solid #fff;border-radius:50%;animation:ring 2.2s ease-out infinite;transform:translate(-50%,-50%)}
@keyframes ring{from{width:0;height:0;opacity:1}to{width:60vw;height:18vw;opacity:0}}
.th-pond .duck{animation:paddle 5s linear infinite}
@keyframes paddle{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.th-pond .friend{animation:duckIn 1.6s cubic-bezier(.2,1.4,.4,1) both,bob 1.2s 1.6s ease-in-out infinite}
@keyframes duckIn{from{transform:translateY(40vh) scale(.3)}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
/* 4단 구름 섬 */
.th-cloud{background:linear-gradient(#9EC9FF,#D9ECFF 60%,#FFF1FA)}
.th-cloud .cl{font-size:30vw;top:20%;animation:clL 2s ease-in forwards}
.th-cloud .cl.r{animation-name:clR}
@keyframes clL{to{transform:translateX(-70vw)}}@keyframes clR{to{transform:translateX(70vw)}}
.th-cloud .beam{position:absolute;left:50%;top:0;width:40vw;height:100%;transform:translateX(-50%);background:linear-gradient(#FFF7C2cc,#fff0);animation:beam 2.4s ease-out both}
@keyframes beam{from{opacity:0;width:0}}
.th-cloud .friend{animation:fly 2.6s ease-in-out both}
@keyframes fly{0%{left:-25%;top:10%;transform:rotate(-15deg)}50%{left:45%;top:28%;transform:rotate(10deg)}100%{left:58%;top:20%;transform:rotate(0)}}
.th-cloud .trail{animation:twinkle 1.4s ease-in-out infinite}
/* 5단 무지개 언덕 */
.th-rainbow{background:linear-gradient(#FFE9F6,#FFF8E1 60%,#A8E6A1)}
.th-rainbow svg.arc{position:absolute;left:5%;top:14%;width:90%}
.th-rainbow svg.arc path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.th-rainbow .friend{animation:spinIn 1.6s 1s cubic-bezier(.2,1.3,.4,1) both,spinJ 1.2s 2.6s ease-in-out infinite}
@keyframes spinIn{from{transform:scale(0) rotate(-720deg)}}
@keyframes spinJ{50%{transform:translateY(-16px) rotate(15deg)}}
/* 6단 사탕 계곡 */
.th-candy{background:linear-gradient(#FFD6EC,#FFF0F7 60%,#FFC1DD)}
.th-candy .cd{animation:candyRain linear infinite}
@keyframes candyRain{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(720deg)}}
.th-candy .friend{animation:catch .7s ease-in-out infinite alternate}
@keyframes catch{from{transform:translateX(-30px) rotate(-8deg)}to{transform:translateX(30px) rotate(8deg)}}
/* 7단 반딧불 동굴 */
.th-firefly{background:radial-gradient(circle at 50% 70%,#3B2D6B,#140E2B 75%)}
.th-firefly .ff{width:9px;height:9px;border-radius:50%;background:#F7FF8A;box-shadow:0 0 12px 5px #E9FF6A;animation:ff ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:.4}}
.th-firefly .friend{animation:dragon 2s cubic-bezier(.2,1.3,.4,1) both,bob 1.4s 2s ease-in-out infinite}
@keyframes dragon{from{transform:translateY(-60vh) scale(.2) rotate(30deg);opacity:0}}
.th-firefly .spk{animation:spark 1.2s ease-out infinite}
@keyframes spark{from{transform:scale(.2);opacity:1}to{transform:scale(2.2);opacity:0}}
.th-firefly .msg{background:#fffffff2}
/* 8단 눈꽃 산 */
.th-snow{background:linear-gradient(#CFE8FF,#F4FAFF 60%,#FFFFFF)}
.th-snow .sf{color:#9CCBFF;animation:snowF linear infinite}
@keyframes snowF{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
.th-snow .friend{animation:slide 2.4s cubic-bezier(.3,.7,.4,1) both}
@keyframes slide{0%{left:110%;bottom:58%;transform:rotate(-20deg)}70%{left:52%;bottom:58%;transform:rotate(-20deg)}100%{left:60%;bottom:58%;transform:rotate(0)}}
/* 9단 별빛 성 */
.th-castle{background:linear-gradient(#1E1650,#4C2E8F 60%,#B57BE0)}
.th-castle .fw{width:6px;height:6px;border-radius:50%;animation:fw 1.6s ease-out infinite}
@keyframes fw{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.th-castle .castle{font-size:36vw;left:50%;bottom:54%;transform:translateX(-50%);filter:drop-shadow(0 0 30px #FFE57A);animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 60px #FFF3A8)}}
.th-castle .friend{animation:lionIn 1.4s 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes lionIn{from{transform:scale(0)}}
@keyframes twinkle{50%{opacity:.2;transform:scale(.7)}}

/* 가로 화면 안내 */
.rotate{display:none}
@media (orientation:landscape) and (max-height:520px){
  .rotate{display:grid;position:fixed;inset:0;z-index:999;place-items:center;background:linear-gradient(#FFE6F2,#E6F6FF);text-align:center;font-size:22px;color:#8152A3}
  .rotate div{font-size:60px;animation:rot 1.6s ease-in-out infinite}
}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* ===== 예온이 리그 애니메이션 ===== */
.yeon{display:block;width:100%;height:auto;overflow:visible}
.yeon g{transform-box:view-box}
.yeon .bodyAll{transform-origin:190px 400px}
.yeon .head{transform-origin:188px 196px}
.yeon .torso{transform-origin:187px 300px}
.yeon .armL{transform-origin:142px 214px}
.yeon .armR{transform-origin:232px 214px}
.yeon .legL{transform-origin:168px 304px}
.yeon .legR{transform-origin:206px 304px}
.yeon .wingL{transform-origin:156px 236px}
.yeon .wingR{transform-origin:218px 236px}
.yeon .cape{transform-origin:187px 212px}
.yeon .shadow{transform-box:fill-box;transform-origin:center}
.yeon .food,.yeon .emo text{display:none}
.yeon .spark{animation:ySpark 1.2s ease-in-out infinite}
@keyframes ySpark{0%,100%{opacity:.2}50%{opacity:1}}

/* 가만히 서 있기: 숨쉬기 + 고개 까딱 + 팔 살랑 */
.yeon.idle .bodyAll{animation:yBreath 2.8s ease-in-out infinite}
.yeon.idle .head{animation:yHeadIdle 4.2s ease-in-out infinite}
.yeon.idle .armL{animation:yArmIdleL 2.8s ease-in-out infinite}
.yeon.idle .armR{animation:yArmIdleR 2.8s ease-in-out infinite}
.yeon.idle .wingL{animation:yWingL 1.6s ease-in-out infinite}.yeon.idle .wingR{animation:yWingR 1.6s ease-in-out infinite}
@keyframes yBreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.012)}}
@keyframes yHeadIdle{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(2.5deg)}}
@keyframes yArmIdleL{0%,100%{transform:rotate(4deg)}50%{transform:rotate(9deg)}}
@keyframes yArmIdleR{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-9deg)}}
@keyframes yWingL{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes yWingR{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}

/* 걷기 */
.yeon.walk .bodyAll{animation:yBob .32s ease-in-out infinite alternate}
.yeon.walk .legL{animation:yLeg .64s ease-in-out infinite}
.yeon.walk .legR{animation:yLeg .64s ease-in-out -.32s infinite}
.yeon.walk .armL{animation:yArmSwing .64s ease-in-out -.32s infinite}
.yeon.walk .armR{animation:yArmSwing .64s ease-in-out infinite}
.yeon.walk .head{animation:yHeadWalk .64s ease-in-out infinite}
.yeon.walk .wingL{animation:yWingL .4s ease-in-out infinite}.yeon.walk .wingR{animation:yWingR .4s ease-in-out infinite}
@keyframes yBob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes yLeg{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
@keyframes yArmSwing{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes yHeadWalk{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* 달리기 */
.yeon.run .bodyAll{animation:yRunBody .4s ease-in-out infinite}
.yeon.run .legL{animation:yLegRun .4s ease-in-out infinite}
.yeon.run .legR{animation:yLegRun .4s ease-in-out -.2s infinite}
.yeon.run .armL{animation:yArmRun .4s ease-in-out -.2s infinite}
.yeon.run .armR{animation:yArmRun .4s ease-in-out infinite}
.yeon.run .head{transform:rotate(4deg)}
@keyframes yRunBody{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
@keyframes yLegRun{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(34deg)}}
@keyframes yArmRun{0%,100%{transform:rotate(-48deg)}50%{transform:rotate(42deg)}}

/* 기뻐하기: 쪼그렸다 점프 + 만세 */
.yeon.cheer .bodyAll{animation:yJump .9s cubic-bezier(.3,.7,.4,1) infinite}
.yeon.cheer .armL{animation:yHurrayL .9s ease-in-out infinite}
.yeon.cheer .armR{animation:yHurrayR .9s ease-in-out infinite}
.yeon.cheer .legL{animation:yTuckL .9s ease-in-out infinite}
.yeon.cheer .legR{animation:yTuckR .9s ease-in-out infinite}
.yeon.cheer .head{animation:yHeadCheer .9s ease-in-out infinite}
.yeon.cheer .shadow{animation:yShadow .9s cubic-bezier(.3,.7,.4,1) infinite}
.yeon.cheer .e-heart{display:inline;animation:yEmo .9s ease-out infinite}
.yeon.cheer .wingL{animation:yWingL .25s ease-in-out infinite}.yeon.cheer .wingR{animation:yWingR .25s ease-in-out infinite}
@keyframes yJump{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(4px) scale(1.06,.92)}45%{transform:translateY(-46px) scale(.97,1.04)}75%{transform:translateY(0) scale(1.04,.95)}100%{transform:translateY(0) scale(1,1)}}
@keyframes yShadow{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(.6);opacity:.5}}
@keyframes yHurrayL{0%,15%{transform:rotate(20deg)}45%,70%{transform:rotate(155deg)}100%{transform:rotate(20deg)}}
@keyframes yHurrayR{0%,15%{transform:rotate(-20deg)}45%,70%{transform:rotate(-155deg)}100%{transform:rotate(-20deg)}}
@keyframes yTuckL{0%,15%{transform:rotate(0)}45%{transform:rotate(18deg)}75%,100%{transform:rotate(0)}}
@keyframes yTuckR{0%,15%{transform:rotate(0)}45%{transform:rotate(-14deg)}75%,100%{transform:rotate(0)}}
@keyframes yHeadCheer{0%,100%{transform:rotate(0)}45%{transform:rotate(-5deg)}}
@keyframes yEmo{0%{opacity:0;transform:translateY(10px) scale(.5)}40%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-24px) scale(1)}}

/* 먹기: 대나무를 입으로 가져가 냠냠 */
.yeon.eat .food{display:inline}.yeon.eat .wand{display:none}
.yeon.eat .armR{animation:yEatArm 1.1s ease-in-out infinite}
.yeon.eat .head{animation:yChew 1.1s ease-in-out infinite}
.yeon.eat .bodyAll{animation:yBreath 1.1s ease-in-out infinite}
.yeon.eat .armL{transform:rotate(14deg)}
@keyframes yEatArm{0%,100%{transform:rotate(-10deg)}35%,65%{transform:rotate(148deg)}}
@keyframes yChew{0%,30%{transform:rotate(0)}40%{transform:rotate(3deg) translateY(2px)}48%{transform:rotate(0)}56%{transform:rotate(3deg) translateY(2px)}64%,100%{transform:rotate(0)}}

/* 앗! (오답) : 고개 갸웃 + 흔들 */
.yeon.oops .head{animation:yTilt 1s ease-in-out forwards}
.yeon.oops .bodyAll{animation:yShake .45s ease-in-out}
.yeon.oops .armL{transform:rotate(-8deg)}.yeon.oops .armR{animation:yScratch 1s ease-in-out infinite}
.yeon.oops .e-sweat{display:inline}
@keyframes yTilt{to{transform:rotate(9deg)}}
@keyframes yShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes yScratch{0%,100%{transform:rotate(150deg)}50%{transform:rotate(140deg)}}

/* 춤추기(축하) */
.yeon.dance .bodyAll{animation:yDance .8s ease-in-out infinite}
.yeon.dance .armL{animation:yDanceL .8s ease-in-out infinite}
.yeon.dance .armR{animation:yDanceR .8s ease-in-out infinite}
.yeon.dance .legL{animation:yLeg .8s ease-in-out infinite}
.yeon.dance .legR{animation:yLeg .8s ease-in-out -.4s infinite}
.yeon.dance .head{animation:yHeadWalk .8s ease-in-out infinite}
.yeon.dance .e-note{display:inline;animation:yEmo 1.6s ease-out infinite}
.yeon.dance .wingL{animation:yWingL .3s ease-in-out infinite}.yeon.dance .wingR{animation:yWingR .3s ease-in-out infinite}
@keyframes yDance{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-8px)}}
@keyframes yDanceL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(40deg)}}
@keyframes yDanceR{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(-150deg)}}

/* 마법 쓰기 */
.yeon.magic .armR{animation:yCast 1s ease-in-out infinite}
.yeon.magic .bodyAll{animation:yBreath 1s ease-in-out infinite}
@keyframes yCast{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-120deg)}}

@media (prefers-reduced-motion:reduce){.yeon *{animation:none!important}}

/* ===== 내 방 꾸미기 ===== */
.room{position:relative;width:100%;aspect-ratio:3/4;max-height:54dvh;margin:0 auto;border-radius:calc(6*var(--u));overflow:hidden;border:3px solid #fff;box-shadow:0 8px 22px #7f9cc055;touch-action:none}
.room.mini{aspect-ratio:auto;height:min(64vw,300px,40dvh);pointer-events:none}
.ri{position:absolute;font-size:var(--sz);line-height:1;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none;white-space:nowrap}
.stage .ri,.room.mini .ri{pointer-events:none;cursor:default}
.ri-yeon{width:var(--sz)}.ri-yeon svg{width:100%;height:auto;display:block}
.ri-panda img{height:var(--sz);display:block}
.ri-stamp{width:var(--sz);height:var(--sz);opacity:.82;mix-blend-mode:multiply}
.ri-stamp svg,.stico svg,.ti .e svg{width:100%;height:100%;display:block}
.ri-sticker,.ri-ach,.stk2{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 3px #0004)}
.ri-deco{filter:drop-shadow(0 4px 3px #0003)}
.ri.sel{outline:3px dashed #FF5C9A;outline-offset:5px;border-radius:12px;z-index:50}
.ri.pop{animation:riPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes riPop{from{scale:.2}to{scale:1}}
.stico{display:inline-block;width:1em;height:1em}
.rtools{display:flex;align-items:center;justify-content:center;gap:calc(1.4*var(--u));flex-wrap:wrap;min-height:calc(14*var(--u));background:#fff;border-radius:calc(4*var(--u));padding:calc(1.6*var(--u));box-shadow:0 3px 0 #EED6E1;text-align:center}
.tb{display:flex;flex-direction:column;align-items:center;font-size:calc(6*var(--u));line-height:1;padding:4px 6px;border-radius:12px;background:#FFF3F8}
.tb small{font-size:calc(2.8*var(--u));margin-top:2px}
.tb:active{transform:scale(.92)}
.inks{display:flex;gap:6px}
.ink{width:calc(8*var(--u));height:calc(8*var(--u));border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0002}
.ink.on{box-shadow:0 0 0 3px #4A3456}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(2*var(--u))}
.ti{background:#fff;border-radius:calc(4*var(--u));padding:calc(2*var(--u)) 2px;font-size:calc(3*var(--u));display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 #EED6E1;border:3px solid transparent;line-height:1.2}
.ti .e{font-size:calc(9*var(--u));line-height:1.1;width:calc(10*var(--u));height:calc(10*var(--u));display:grid;place-items:center}
.ti.lock{opacity:.45}
.ti.on{border-color:var(--mint)}
.bgsw{width:calc(14*var(--u));height:calc(10*var(--u));border-radius:8px;display:block;border:2px solid #fff;box-shadow:0 1px 4px #0002}

function wander(el, min, max, onMove) {
  let x = parseFloat(el.style.left) || 50;
  const step = () => {
    if (!el.isConnected) return;
    if (el.dataset.busy) { later(step, 1500); return; }
    const nx = Math.max(min, Math.min(max, x + (Math.random() < .5 ? -1 : 1) * rnd(8, 26)));
    const dur = Math.abs(nx - x) * .085 + .4;
    el.style.transitionDuration = dur + 's'; onMove(true, nx < x); el.style.left = nx + '%'; x = nx;
    later(() => { onMove(false, null); later(step, rnd(1600, 4200)); }, dur * 1000);
  };
  later(step, rnd(600, 2000));
}

let round = null;
function weakFirst(n) { return [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(a => { const s = state.stats[n + 'x' + a]; return s && s.wrong > 0 && s.right < s.wrong + 2; }).sort((a, b) => (state.stats[n + 'x' + b].wrong - state.stats[n + 'x' + b].right) - (state.stats[n + 'x' + a].wrong - state.stats[n + 'x' + a].right)).slice(0, 2); }
function startRound() {
  if (timeUp()) { go('limit'); return; }
  const n = vi + 2, weak = weakFirst(n);
  round = { n, correct: 0, eb: 0, es: 0, wrongs: 0, queue: [...weak, ...shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(a => !weak.includes(a)))], review: [], cur: null, lock: false, goldenUsed: false, newClear: false, input: '' };
  page = 'quiz'; trackStart(); render(); nextQ();
}
function makeOptions(n, a) { const v = n * a, c = [v]; for (const x of shuffle([v - n, v + n, v - 1, v + 1, v - 10, v + 10, v + 2, v - 2, n * (a + 2)])) { if (x > 0 && !c.includes(x)) c.push(x); if (c.length === 4) break; } return shuffle(c); }
function groupsHTML(n, a) { return `<div class="groups">${Array.from({ length: a }, () => `<span class="gp">${'<i></i>'.repeat(n)}</span>`).join('')}</div>`; }
function quizPage() {
  if (!round) { page = 'map'; render(); return; }
  $('app').innerHTML = `<header class="top"><button class="ic" onclick="leaveQuiz()">⬅️</button><div class="qdots" id="qdots">${'<i></i>'.repeat(5)}</div><span class="coin" id="cB">🎋 ${state.bamboo}</span><span class="coin st" id="cS">⭐ ${state.stars}</span></header>
  <div class="qstage"><div class="yw" id="qyeon">${yeon('idle')}</div><div class="qbub" id="qbub"></div></div><div id="qarea"></div>`;
}
function nextQ() {
  if (!round) return;
  if (round.correct >= 5) { endRound(); return; }
  if (timeUp()) { trackStop(); round = null; go('limit'); return; }
  round.review.forEach(r => r.wait--);
  const due = round.review.findIndex(r => r.wait <= 0);
  const a = due >= 0 ? round.review.splice(due, 1)[0].a : (round.queue.length ? round.queue.shift() : 1 + Math.floor(Math.random() * 9));
  const golden = !round.goldenUsed && round.correct >= 1 && Math.random() < .2;
  if (golden) round.goldenUsed = true;
  round.cur = { a, ans: round.n * a, golden }; round.lock = false; round.input = '';

  const rec = c.score > state.best, earned = c.score * 5 * (isWeekend() ? 2 : 1) + (rec && c.score > 0 ? 20 : 0);
  state.stars += earned; if (rec) state.best = c.score; save(); SND.play('timeup'); setTimeout(() => SND.play('reward'), 700); confetti(rec ? 80 : 40);
  showModal(`<div style="width:44%;margin:0 auto">${yeon(c.score ? 'cheer' : 'idle')}</div><div class="h2">${rec && c.score ? '🏆 새로운 최고 기록!' : '⏰ 챌린지 끝!'}</div>
   <div style="font-size:calc(5.4*var(--u))">정답 <b style="color:var(--pink)">${c.score}개</b> · 최고 콤보 ${c.maxCombo}</div>
   <div class="sub">별빛 +${earned}${rec && c.score ? ' (신기록 보너스 +20)' : ''}${isWeekend() ? ' · 주말 2배' : ''}<br>최고 기록 ${state.best}개</div>
   <button class="btn blue" onclick="closeModal();openChallenge()">⏱️ 한 번 더</button><button class="btn white" onclick="closeModal();CH=null;go('home')">🏠 홈으로</button>`);
  updCoins('s'); checkStickers();
}

/* =================== 미니게임: 대나무 받기 (30초) =================== */
let MG = null;
function openMinigame() {
  if (state.mg.date !== today()) { state.mg.date = today(); state.mg.tickets = Math.max(state.mg.tickets, 1); save(); }   // 매일 1장 기본 지급
  if (state.mg.tickets <= 0) { SND.play('wrong'); showModal(`<div style="font-size:60px">🧺</div><div class="h2">놀이권이 없어요</div><div class="sub">구구단 문제 5개를 풀 때마다 1장씩 생겨요!</div><button class="btn pink" onclick="closeModal();go('map')">🗺️ 문제 풀러 가기</button><button class="btn white" onclick="closeModal()">닫기</button>`); return; }
  page = 'minigame'; closeModal(); render();
}
function minigamePage() {
  $('app').innerHTML = topBar('🧺 대나무 받기') + `<div class="sub">판다를 손가락으로 움직여 🎋⭐를 받아요! 🐝는 피해요</div>
  <div class="mg" id="mg"><div class="hud"><span>⏱ <b id="mgT">30</b></span><span>🎋 <b id="mgS">0</b></span></div><div class="catcher" id="mgP" style="left:50%"><img src="${pandaImg(stage())}" alt=""></div></div>
  <button class="btn pink" id="mgStart" onclick="startMinigame()">▶ 시작! (놀이권 1장, 남은 ${state.mg.tickets}장)</button>`;
}
function startMinigame() {
  if (MG || state.mg.tickets <= 0) return;
  state.mg.tickets--; save(); $('mgStart').style.display = 'none'; SND.play('go');
  const box = $('mg'), P = $('mgP'); const W = () => box.clientWidth, H = () => box.clientHeight;
  MG = { x: 50, drops: [], score: 0, stars: 0, end: performance.now() + 30000, last: performance.now(), spawn: 0, raf: 0, stun: 0 };
  const move = e => { const r = box.getBoundingClientRect(); const cx = (e.touches ? e.touches[0].clientX : e.clientX); MG.x = Math.max(8, Math.min(92, (cx - r.left) / r.width * 100)); e.preventDefault(); };
  box.onpointerdown = box.onpointermove = move; box.addEventListener('touchmove', move, { passive: false });
  const loop = t => {
    if (!MG || page !== 'minigame') return;
    const dt = Math.min(50, t - MG.last); MG.last = t;
    if (t > MG.stun) P.style.left = MG.x + '%';
    MG.spawn -= dt;
    if (MG.spawn <= 0) { MG.spawn = rnd(380, 700); const r = Math.random(); const type = r < .68 ? 'b' : r < .82 ? 's' : 'bee'; const d = document.createElement('div'); d.className = 'drop'; d.textContent = type === 'b' ? '🎋' : type === 's' ? '⭐' : '🐝'; box.appendChild(d); MG.drops.push({ el: d, x: rnd(8, 92), y: -5, v: rnd(22, 38) + (30000 - (MG.end - t)) / 1500, type }); }
    const px = parseFloat(P.style.left);
    for (const d of MG.drops) {
      d.y += d.v * dt / 1000; d.el.style.left = d.x + '%'; d.el.style.top = d.y + '%';
      if (!d.done && d.y > 74 && d.y < 92 && Math.abs(d.x - px) < 11) {
        d.done = true; d.el.remove();
        if (d.type === 'bee') { SND.play('bee'); MG.stun = t + 600; P.style.transform = 'translateX(-50%) rotate(-15deg)'; setTimeout(() => P.style.transform = 'translateX(-50%)', 500); }
        else { SND.play('catch'); if (d.type === 'b') MG.score++; else { MG.stars++; MG.score++; } $('mgS').textContent = MG.score; burstAt(P, d.type === 'b' ? '🎋' : '⭐', 4); }
      }
      if (d.y > 105 && !d.done) { d.done = true; d.el.remove(); }
    }
    MG.drops = MG.drops.filter(d => !d.done);
    const left = Math.max(0, MG.end - t); $('mgT').textContent = Math.ceil(left / 1000);
    if (left <= 0) return endMinigame();
    MG.raf = requestAnimationFrame(loop);
  };
  MG.raf = requestAnimationFrame(loop);
}
function stopMinigame() { if (MG) { cancelAnimationFrame(MG.raf); MG = null; } }
function endMinigame() {
  const m = MG; stopMinigame(); const bam = Math.min(10, Math.floor(m.score / 3)), st = m.stars * 2;
  state.bamboo += bam; state.stars += st; state.mg.plays++; const rec = m.score > state.mg.best; if (rec) state.mg.best = m.score; save();
  SND.play('timeup'); setTimeout(() => SND.play('reward'), 600); confetti(40);
  showModal(`<div style="width:40%;margin:0 auto"><img src="${pandaImg(stage())}" style="width:100%;animation:pHop .6s 3" alt=""></div><div class="h2">${rec ? '🥇 최고 기록!' : '🧺 놀이 끝!'}</div><div style="font-size:calc(5*var(--u))">받은 개수 ${m.score}개</div>
   <div class="sub">진짜 선물: 🎋 대나무 +${bam}${st ? ` · ⭐ 별빛 +${st}` : ''}<br>(3개 받을 때마다 대나무 1개, 최대 10개)</div>
   ${state.mg.tickets > 0 ? `<button class="btn pink" onclick="closeModal();render()">🔁 한 번 더 (남은 ${state.mg.tickets}장)</button>` : ''}<button class="btn green" onclick="closeModal();go('garden')">🐼 먹이 주러 가기</button><button class="btn white" onclick="closeModal();go('home')">🏠 홈</button>`);
  checkStickers();
}

/* =================== 스티커 도감 =================== */
function stickerPage() {
  $('app').innerHTML = topBar('📒 스티커 도감') + `<div class="sub">모은 스티커 ${state.stickers.length} / ${STICKERS.length}</div>
  <div class="stickers">${STICKERS.map(([id, e, n]) => `<div class="stk ${state.stickers.includes(id) ? '' : 'lock'}"><span class="e">${e}</span>${n}</div>`).join('')}</div>
  <div class="sub">회색 스티커는 아직 모으지 못했어요. 구구단, 판다 돌보기, 출석, 놀이로 모아요!</div>`;
}

/* =================== 학습 시간 끝 =================== */
function limitPage() {
  $('app').innerHTML = topBar('🌙 오늘의 공부 끝') + `<div class="dressing" style="height:min(70vw,320px)"><div class="spot"></div><div class="yw">${yeon('dance')}</div></div>
  <div class="card" style="text-align:center"><div class="h2">오늘의 마법 공부 끝!</div><div class="sub">정말 잘했어요! 내일 또 만나요 💖<br>판다 돌보기, 꾸미기, 스티커 보기는 계속할 수 있어요.</div></div>
  <button class="btn green" onclick="go('garden')">🐼 판다 돌보기</button><button class="btn purple" onclick="go('shop')">🎀 꾸미기</button>`;
}

/* =================== 부모님 화면 =================== */
let gateAns = 0, parentOpen = false, resetArmed = false;
function parentGate() {
  const a = 21 + Math.floor(Math.random() * 50), b = 13 + Math.floor(Math.random() * 30); gateAns = a + b;
  showModal(`<div class="h2">🔐 부모님 확인</div><div class="sub">${a} + ${b} = ?</div><input id="gateIn" type="number" inputmode="numeric" style="font-size:24px;padding:10px;border-radius:14px;border:3px solid #E9CDEB;text-align:center">
  <button class="btn" onclick="if(+$('gateIn').value===gateAns){parentOpen=true;closeModal();go('parent')}else{toast('다시 확인해 주세요');parentGate()}">확인</button><button class="btn white sm" onclick="closeModal()">닫기</button>`);
}
function parentPage() {
  if (!parentOpen) { page = 'home'; render(); return; }
  const st = state.stats, days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return [('일월화수목금토')[d.getDay()], state.days.includes(dkey(d))]; });
  const weak = Object.entries(st).filter(([k, v]) => v.wrong && v.right < v.wrong + 2).sort((a, b) => b[1].wrong - a[1].wrong).slice(0, 12);
  $('app').innerHTML = topBar('👨‍👩‍👧 부모님 화면') + `
  <div class="card"><b>📊 오늘</b><div class="sub" style="text-align:left;font-size:15px;line-height:1.8">공부 시간 ${Math.floor(spent() / 60)}분 ${spent() % 60}초 · 정답 ${dailyCount()}개<br>연속 학습 ${streak()}일 · 구출 ${state.villages.filter(v => v >= MASTER).length}/8 · 챌린지 최고 ${state.best}개<br>판다 성장 ${state.growth} (${STAGE_N[stage()]}) · 스티커 ${state.stickers.length}/${STICKERS.length} · 출석 ${state.att.count}회</div></div>
  <div class="card"><b>🗓 최근 7일</b><div class="row" style="justify-content:space-between;margin-top:6px">${days.map(([w, on]) => `<div style="text-align:center;font-size:13px">${on ? '🟢' : '⚪'}<br>${w}</div>`).join('')}</div></div>
  <div class="card"><b>📈 단별 정답률</b>${Array.from({ length: 8 }, (_, i) => { const n = i + 2; let r = 0, w = 0; for (let a = 1; a <= 9; a++) { const s = st[n + 'x' + a]; if (s) { r += s.right; w += s.wrong; } } const pc = r + w ? Math.round(r / (r + w) * 100) : 0; return `<div class="row" style="margin-top:6px;font-size:14px"><span style="width:34px">${n}단</span><div class="bar g grow"><i style="width:${pc}%"></i></div><span style="width:74px;text-align:right" class="sub">${r + w ? pc + '% (' + r + '/' + (r + w) + ')' : '-'}</span></div>`; }).join('')}</div>
  <div class="card"><b>🔁 자주 틀리는 문제</b> <span class="sub">(해당 단을 풀 때 먼저 다시 나와요)</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${weak.length ? weak.map(([k, v]) => `<span class="coin" style="font-size:14px">${k.replace('x', '×')} <small>틀림 ${v.wrong}·맞음 ${v.right}</small></span>`).join('') : '<span class="sub">아직 없어요</span>'}</div></div>
  <div class="card"><b>⏰ 하루 학습 시간</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${[5, 10, 15, 20, 0].map(m => `<button class="tab ${state.limit === m ? 'on' : ''}" style="flex:0 0 auto" onclick="state.limit=${m};save();render()">${m ? m + '분' : '제한 없음'}</button>`).join('')}</div><div class="sub" style="text-align:left;margin-top:6px">시간이 끝나면 문제 풀기·챌린지만 쉬고, 판다 돌보기·꾸미기는 계속할 수 있어요.</div></div>
  <div class="card"><b>✏️ 이름 · 소리</b><div class="sub" style="text-align:left">아이 이름</div><input id="pn1" maxlength="15" value="${esc(state.child)}" style="width:100%;font-size:18px;padding:8px;border-radius:12px;border:2px solid #E9CDEB">
   <div class="sub" style="text-align:left;margin-top:6px">판다 이름</div><input id="pn2" maxlength="15" value="${esc(state.panda)}" style="width:100%;font-size:18px;padding:8px;border-radius:12px;border:2px solid #E9CDEB">
   <div class="row" style="margin-top:8px"><button class="btn green sm" onclick="state.child=$('pn1').value.trim()||'예온이';state.panda=$('pn2').value.trim()||'뭉치';save();toast('저장했어요')">이름 저장</button><button class="btn white sm" onclick="state.sound=!state.sound;save();render()">${state.sound ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐'}</button></div></div>
  <div class="card"><b>💾 기록 백업</b><div class="sub" style="text-align:left">휴대폰을 바꾸거나 앱을 지우기 전에 백업 코드를 복사해 두세요. (인터넷으로 보내지 않아요)</div>
   <div class="row" style="margin-top:6px"><button class="btn blue sm" onclick="copyBackup()">📋 백업 코드 복사</button><button class="btn white sm" onclick="restoreUI()">📥 복원하기</button></div><div id="restoreBox"></div></div>
  <button class="btn pink" id="resetBtn" onclick="resetAll()">🗑️ 모든 기록 초기화</button>
  <button class="btn white" onclick="parentOpen=false;go('home')">부모님 화면 닫기</button>`;
}
function copyBackup() { const code = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); try { navigator.clipboard.writeText(code).then(() => toast('백업 코드를 복사했어요'), () => showCode(code)); } catch (e) { showCode(code); } }
function showCode(code) { $('restoreBox').innerHTML = `<textarea style="width:100%;height:90px;margin-top:6px" readonly>${code}</textarea><div class="sub">위 코드를 길게 눌러 복사하세요</div>`; }
function restoreUI() { $('restoreBox').innerHTML = `<textarea id="rcode" style="width:100%;height:90px;margin-top:6px" placeholder="백업 코드를 붙여 넣으세요"></textarea><button class="btn green sm" onclick="doRestore()">복원</button>`; }
function doRestore() { try { const o = JSON.parse(decodeURIComponent(escape(atob($('rcode').value.trim())))); state = migrate(o); ensureRoom(); save(); toast('복원했어요!'); render(); } catch (e) { toast('코드가 올바르지 않아요'); } }
function resetAll() {
  if (!resetArmed) { resetArmed = true; $('resetBtn').textContent = '⚠️ 정말 지울까요? 한 번 더 누르면 모두 삭제'; setTimeout(() => { resetArmed = false; const b = $('resetBtn'); if (b) b.textContent = '🗑️ 모든 기록 초기화'; }, 4000); return; }
  trackStop(); const keep = { child: state.child, panda: state.panda, limit: state.limit, sound: state.sound }; state = defaults(); Object.assign(state, keep, { story: true }); ensureRoom(); save(); resetArmed = false; toast('초기화했어요'); render();
}

/* =================== 시작 =================== */
setInterval(() => { if (page === 'quiz' && timeUp() && round && !round.lock) { trackStop(); round = null; go('limit'); } if (streak() >= 3 && !state.sibling) { state.sibling = true; save(); } }, 3000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { trackStop(); save(); } else if (page === 'quiz' || (page === 'challenge' && CH && CH.active)) trackStart(); });
window.addEventListener('pagehide', () => { trackStop(); save(); });
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(() => { });

</script>
</body>
