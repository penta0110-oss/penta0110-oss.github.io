const defaultState=()=>({child:'예온이',panda:'뭉치',bamboo:3,stars:0,apple:1,honey:0,growth:0,lastFeed:Date.now(),villages:Array(8).fill(0),stats:{},owned:['하얀 뽀글이'],equipped:{dress:'하얀 뽀글이'},daily:{},days:[],studySecs:{},best:0,sound:true,limit:10,story:false,claimedDays:[],sibling:false,castle:false});let state;try{state={...defaultState(),...JSON.parse(localStorage.getItem('yeon_magicland_v1')||'{}')}}catch{state=defaultState()}let page='home',modal='',round=null,challenge=null,activeVillage=0,showAnswers=true,toast='',sessionStart=null,sessionDay=null,sessionAccum=0,timer=null,resetArmed=false,parentA=0,parentB=0,unlockParent=false;const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const save=()=>{try{localStorage.setItem('yeon_magicland_v1',JSON.stringify(state))}catch{}};const totalTime=()=>state.studySecs[today()]||0;const spent=()=>totalTime()+(sessionStart&&sessionDay===today()?Math.floor((Date.now()-sessionStart)/1000):0);const timeUp=()=>state.limit!==0&&spent()>=state.limit*60;function trackStart(){if(!sessionStart){sessionStart=Date.now();sessionDay=today()}}function trackStop(){if(sessionStart){state.studySecs[sessionDay]=(state.studySecs[sessionDay]||0)+Math.floor((Date.now()-sessionStart)/1000);sessionStart=null;save()}}function go(p){if(p!=='quiz'&&p!=='challenge')trackStop();page=p;modal='';render()}function beep(ok=true){if(!state.sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)();[0,0.11,0.22].forEach((t,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=(ok?[523,659,784]:[350,300,260])[i];g.gain.setValueAtTime(.06,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.15);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.16)});setTimeout(()=>ctx.close(),800)}catch{}}function playFanfare(){if(!state.sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1046].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.27)});setTimeout(()=>c.close(),1200)}catch{}}function pop(s){toast=s;render();setTimeout(()=>{toast='';render()},1100)}function dailyCount(){return state.daily[today()]||0}function markCorrect(n,a){state.daily[today()]=(state.daily[today()]||0)+1;if(!state.days.includes(today()))state.days.push(today());let key=n+'x'+a;if(!state.stats[key])state.stats[key]={right:0,wrong:0};state.stats[key].right++;save()}
function streak(){let d=new Date(),count=0;for(let i=0;i<400;i++){let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!state.days.includes(k))break;count++;d.setDate(d.getDate()-1)}if(!count){d=new Date(Date.now()-86400000);for(let i=0;i<400;i++){let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!state.days.includes(k))break;count++;d.setDate(d.getDate()-1)}}return count}
function shell(content){$('root').innerHTML=`<header class="top"><button class="back" onclick="go('home')">⌂</button><strong>✨ ${state.child}의 구구단 모험</strong><span class="pill">🎋 ${state.bamboo}</span><span class="pill">⭐ ${state.stars}</span></header>${content}${toast?`<div class="float">${toast}</div>`:''}<div class="footer">기록은 이 기기에만 저장됩니다 · 광고와 결제 없음</div>${modal?`<div class="modalwrap"><div class="modal">${modal}</div></div>`:''}`}
function home(){let done=state.villages.filter(x=>x>=15).length;shell(`<section class="home-stage"><div class="home-art"><div class="home-heading"><span>✨ ${escapeHtml(state.child)}의</span><strong>구구단 모험</strong><small>구구단 마법으로 친구들을 구하자!</small></div><div class="home-mission"><b>🎁 오늘의 미션 ${Math.min(10,dailyCount())}/10</b><div class="progress"><div style="width:${Math.min(100,dailyCount()*10)}%"></div></div>${dailyCount()>=10&&!state.claimedDays.includes(today())?'<button class="btn small" onclick="dailyGift()">🎁 선물 고르기</button>':''}<small>구출한 친구 ${done}/8 · 연속 공부 ${streak()}일</small></div></div><nav class="home-menu"><button class="btn" onclick="go('map')">🗺️ 구구단 모험 <small>마을의 친구들을 구해요!</small></button><button class="btn purple" onclick="go('panda')">🐼 판다 돌보기 <small>뭉치에게 먹이를 줘요!</small></button><button class="btn pink" onclick="go('shop')">🎀 꾸미기 상점 <small>예온이와 정원을 꾸며요!</small></button><button class="btn blue" onclick="openChallenge()">⏱️ 마법 챌린지 <small>60초 구구단 도전!</small></button><button class="btn green parent-shortcut" onclick="parentGate()">🔐 부모님 화면</button></nav></section>`)}
function map(){shell(`<h1 class="title">🗺️ 마법의 8개 마을</h1><p class="center">각 마을에서 정답 15개를 모아 친구를 구해요!</p><div class="grid">${names.map((n,i)=>`<button class="village ${i>0&&state.villages[i-1]<15?'locked':''}" ${i>0&&state.villages[i-1]<15?'disabled':''} onclick="village(${i})"><span class="emoji">${symbols[i]} ${animals[i]}</span>${i+2}단 ${n}<p class="muted">${Math.min(15,state.villages[i])}/15 ${state.villages[i]>=15?'🎉 구출 완료':'⭐'}</p><div class="progress"><div style="width:${Math.min(100,state.villages[i]/15*100)}%"></div></div></button>`).join('')}</div>`)}
function village(i){activeVillage=i;showAnswers=true;go('village')}function villagePage(){let n=activeVillage+2;shell(`<h1 class="title">${symbols[activeVillage]} ${n}단 ${names[activeVillage]}</h1><div class="card center"><h3>📖 마법 주문서</h3><button class="btn small blue" onclick="showAnswers=!showAnswers;render()">${showAnswers?'🙈 답 가리고 외우기':'👀 답 모두 보기'}</button><div class="grid">${Array.from({length:9},(_,i)=>`<button class="item" onclick="reveal(${i})" id="spell${i}">${n} × ${i+1} = <b>${showAnswers?n*(i+1):'?'}</b></button>`).join('')}</div></div><div class="card center"><p>마을 누적 정답 ${state.villages[activeVillage]}개</p><button class="btn" onclick="startRound()">🪄 마법 문제 풀기 (5개)</button></div>`)}function reveal(i){let el=$('spell'+i);el.innerHTML=`${activeVillage+2} × ${i+1} = <b>${(activeVillage+2)*(i+1)}</b>`}
function wrongPriority(n){return Array.from({length:9},(_,i)=>i+1).filter(a=>{let s=state.stats[n+'x'+a];return s&&s.wrong>s.right}).sort((a,b)=>(state.stats[n+'x'+b].wrong-state.stats[n+'x'+b].right)-(state.stats[n+'x'+a].wrong-state.stats[n+'x'+a].right)).slice(0,2)}function startRound(){if(timeUp()){go('limit');return}let n=activeVillage+2;round={n,correct:0,earnedB:0,earnedS:0,queue:wrongPriority(n),review:[],current:null,feedback:false,wrong:false};nextQuestion();go('quiz');trackStart()}
function nextQuestion(){if(round.correct>=5){trackStop();page='chest';round.gifts=shuffle([['🎋 대나무 5개','bamboo',5],['🎋 대나무 8개','bamboo',8],['⭐ 별빛 30개','stars',30],['🍎 사과 1개','apple',1],['🍯 꿀 1개','honey',1]]).slice(0,3);render();return}round.review.forEach(x=>x.wait--);let due=round.review.findIndex(x=>x.wait<=0);let a=due>=0?round.review.splice(due,1)[0].a:round.queue.length?round.queue.shift():Math.ceil(Math.random()*9);round.current={a,answer:round.n*a,options:options(round.n,a)};round.feedback=false;round.wrong=false;render()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function options(n,a){let v=n*a,choices=[v],pool=[v-n,v+n,v-1,v+1,v-10,v+10,v-2,v+2,v-n*2,v+n*2].filter(x=>x>0&&x!==v);for(let x of shuffle(pool)){if(!choices.includes(x))choices.push(x);if(choices.length===4)break}return shuffle(choices)}function dotHtml(n,a){return `<div class="dots">${Array.from({length:a},()=>`<div class="dotgroup">${Array.from({length:n},()=>'<span class="dot"></span>').join('')}</div>`).join('')}</div><p class="muted center">${n}개씩 ${a}묶음 = ${n*a}개</p>`}
function quiz(){if(!round){go('map');return}let q=round.current;if(timeUp()){trackStop();go('limit');return}let direct=state.villages[activeVillage]>=15;shell(`<h1 class="title">🪄 ${round.n}단 마법 주문</h1><div class="card center"><div class="row"><b>이번 판 ${round.correct}/5</b><b>🎋 +${round.earnedB} ⭐ +${round.earnedS}</b></div><div class="progress"><div style="width:${round.correct*20}%"></div></div><div class="question">${round.n} × ${q.a} = ?</div>${!direct&&state.villages[activeVillage]<5?dotHtml(round.n,q.a):''}${round.feedback?`<div class="notice">괜찮아! ${round.n}개씩 ${q.a}묶음이면 <b>${q.answer}개</b>예요 💗${dotHtml(round.n,q.a)}</div><button class="btn green" onclick="nextQuestion()">알겠어! ➜</button>`:direct?`<input class="inputAnswer" id="answer" readonly placeholder="숫자를 눌러요"><div class="keys">${[1,2,3,4,5,6,7,8,9,'←',0,'확인'].map(k=>`<button class="${k==='확인'?'ok':''}" onclick="keypad('${k}')">${k}</button>`).join('')}</div>`:`<div class="grid">${q.options.map(x=>`<button class="choice" onclick="answer(${x})">${x}</button>`).join('')}</div>`}</div>`)}function keypad(k){let el=$('answer');if(!el)return;if(k==='확인'){if(el.value)answer(Number(el.value));return}el.value=k==='←'?el.value.slice(0,-1):(el.value+String(k)).slice(0,3)}

const rescueThemes=[
 ['🎋','🐰','대나무가 쑥쑥 자라고 토끼 친구가 나타났어요!','forest'],

function rescueModal(i){const [symbol,animal,story,theme]=rescueThemes[i];return `<section class="rescue-scene ${theme}" style="--scene:url('assets/village-${i+2}.webp')" role="status" aria-label="${i+2}단 마을 구출 성공">
<div class="rescue-sky">${Array.from({length:14},(_,j)=>`<span style="--x:${(j*37+9)%95}%;--delay:${(j%7)*.18}s;--size:${14+j%5*7}px">${j%3===0?symbol:'✦'}</span>`).join('')}</div>
<div class="rescue-badge">🎉 ${i+2}단 마을 클리어!</div><div class="rescue-characters" aria-hidden="true"><span class="rescue-friend">${animal}</span></div>

<p class="rescue-caption">예온이와 뭉치가 마법으로 친구를 구했어요! 💗</p>
<button class="btn green" onclick="modal='';nextQuestion()">🌟 다음 모험으로</button>`}

function answer(v){if(!round||round.feedback)return;let q=round.current,key=round.n+'x'+q.a;if(!state.stats[key])state.stats[key]={right:0,wrong:0};if(v===q.answer){beep();round.correct++;round.earnedB++;round.earnedS+=10;state.bamboo++;state.stars+=10;state.villages[activeVillage]++;markCorrect(round.n,q.a);if(state.villages[activeVillage]===15){playFanfare();modal=rescueModal(activeVillage);if(state.villages.every(x=>x>=15)&&!state.castle){state.castle=true;if(!state.owned.includes('반짝 왕관'))state.owned.push('반짝 왕관')}}save();if(modal){render()}else {render();pop('⭐ 정답! 대나무 +1');setTimeout(()=>{if(page==="quiz"&&round&&!round.feedback&&!modal)nextQuestion()},450)}}else{beep(false);state.stats[key].wrong++;round.review.push({a:q.a,wait:2});round.feedback=true;save();render()}}
function chest(){shell(`<h1 class="title">🎁 마법 보물상자</h1><div class="card center"><div style="font-size:85px">🎁✨</div><p>정답 5개를 모두 맞혔어요! 선물을 직접 골라요.</p><div class="grid">${round.gifts.map((g,i)=>`<button class="btn pink" onclick="pickGift(${i})">${g[0]}</button>`).join('')}</div><p class="muted">확률형 뽑기가 아니에요. 원하는 선물 하나를 골라요!</p></div>`)}function pickGift(i){let g=round.gifts[i];state[g[1]]+=g[2];round.gift=g[0];save();go('result')}
function result(){shell(`<h1 class="title">🎊 마법 성공!</h1><div class="card center"><div style="font-size:80px">🐼🌟</div><h2>예온이 최고!</h2><p>🎋 대나무 +${round.earnedB} · ⭐ 별빛 +${round.earnedS}</p><p>🎁 선택한 선물: ${round.gift}</p>${state.villages[activeVillage]>=15?`<div class="notice">${animals[activeVillage]} 친구가 정원에서 기다려요!</div>`:''}${state.castle?'<div class="notice">🏰 별빛 성 완성! 반짝 왕관을 받았어요!</div>':''}</div><button class="btn green" onclick="go('panda')">🐼 판다에게 먹이 주러 가기</button><button class="btn pink" onclick="startRound()">🔄 한 번 더</button><button class="btn blue" onclick="go('map')">🗺️ 모험 지도</button>`)}
function stage(){return state.growth>=120?3:state.growth>=60?2:state.growth>=20?1:0}const stageNames=['아기','꼬마','어린이','멋쟁이'];function panda(){let s=stage(),sleep=Date.now()-state.lastFeed>=21600000;let deco=shop.filter(x=>x[0]==='garden'&&state.owned.includes(x[1])).map(x=>x[2]).join(' ');let pals=state.villages.map((v,i)=>v>=15?animals[i]:'').join(' ');shell(`<h1 class="title">🐼 ${state.panda}의 정원</h1><div class="garden"><div class="speech" id="pandaspeech">${sleep?'배고파요… 🥺':'냠냠! 예온이 좋아! 💗'}</div><img class="panda panda-art ${sleep?'sleepy':''}" src="assets/panda-stage-${s}.gif" id="panda" onclick="pet()" alt="성장한 뭉치 판다를 쓰다듬기"><div>${pals} ${state.sibling?'🐼':''}</div><div style="font-size:30px">${deco}</div></div><div class="card center"><h3>${stageNames[s]} 판다 · 성장 ${state.growth}</h3><div class="growth-steps">${[0,1,2,3].map(i=>`<img class="${s===i?'active':''}" src="assets/panda-stage-${i}.png" alt="${stageNames[i]} 판다">`).join('')}</div><p class="muted">판다를 톡 누르면 쓰다듬을 수 있어요!</p><div class="progress"><div style="width:${s===3?100:((state.growth-[0,20,60][s])/([20,60,120][s]-[0,20,60][s]))*100}%"></div></div><div class="grid"><button class="btn green" onclick="feed('bamboo',1)">🎋 대나무 (${state.bamboo})</button><button class="btn pink" onclick="feed('apple',3)">🍎 사과 (${state.apple})</button><button class="btn" onclick="feed('honey',5)">🍯 꿀 (${state.honey})</button><button class="btn blue" onclick="go('map')">🪄 먹이 모으기</button></div></div>`)}function pet(){let el=$('panda');el.classList.remove('bounce');void el.offsetWidth;el.classList.add('bounce');$('pandaspeech').textContent='💗 쓰담쓰담! 기분 좋아요!';beep()}function feed(type,value){if(state[type]<=0){pop('먹이가 없어요! 🪄');return}let before=stage();state[type]--;state.growth+=value;state.lastFeed=Date.now();save();beep();panda();let el=$('panda');if(el){el.classList.add('eating');$('pandaspeech').textContent='냠냠냠~ 아삭아삭! 😋'}if(stage()>before){playFanfare();modal=`<h2>🎉 뭉치가 자랐어요!</h2><div class="growth-flash"><img src="assets/panda-stage-${stage()}.gif" alt="성장한 뭉치"><p>${state.panda}가 ${stageNames[stage()]} 판다로 자랐어요!</p></div><button class="btn" onclick="modal='';render()">야호! 💖</button>`;setTimeout(()=>render(),900)}else setTimeout(()=>{let p=$('panda');if(p)p.classList.remove('eating')},1650)}
function shopPage(){shell(`<h1 class="title">🎀 꾸미기 상점</h1><p class="center">한 번 산 아이템은 언제든 다시 입을 수 있어요! ⭐ ${state.stars}</p><div class="card center"><div class="outfit-preview"><img src="assets/hero-v3.webp" alt="예온이 캐릭터"><div class="outfit-layer">${['dress','hair','back','hand'].map(t=>{let x=shop.find(z=>z[1]===state.equipped[t]);return x?`<span title="${x[1]}">${x[2]}</span>`:''}).join('')}</div></div><p class="outfit-caption">구매한 아이템은 캐릭터 옆 장식으로 표시됩니다.</p><p>현재 꾸미기: ${Object.values(state.equipped).join(' · ')}</p></div>${[['dress','옷'],['hair','머리'],['back','등'],['hand','손'],['garden','정원 장식']].map(([type,label])=>`<h3>${label}</h3><div class="items">${shop.filter(x=>x[0]===type).map(x=>`<div class="item"><div class="big">${x[2]}</div><b>${x[1]}</b><div class="muted">${state.owned.includes(x[1])?'보유 중':`⭐ ${x[3]}`}</div><button onclick="buy('${x[1]}')">${state.owned.includes(x[1])?(type==='garden'?'설치됨':state.equipped[type]===x[1]?'착용 중':'착용하기'):'구매하기'}</button></div>`).join('')}</div>`).join('')}`)}function buy(name){let x=shop.find(x=>x[1]===name);if(!x)return;if(!state.owned.includes(name)){if(state.stars<x[3]){pop('별빛이 부족해요 ⭐');return}state.stars-=x[3];state.owned.push(name)}if(x[0]!=='garden')state.equipped[x[0]]=name;save();render()}
function dailyGift(){let available=shop.filter(x=>!state.owned.includes(x[1]));if(!available.length){state.claimedDays.push(today());save();return}let gifts=shuffle(available).slice(0,3);modal=`<h2>🎁 오늘의 미션 성공!</h2><p>무료 선물 하나를 골라요.</p>${gifts.map(x=>`<button class="btn pink" onclick="claimGift('${x[1]}')">${x[2]} ${x[1]}</button>`).join('')}`;render()}function claimGift(n){if(state.claimedDays.includes(today()))return;state.owned.push(n);state.claimedDays.push(today());save();modal='';render()}
function openChallenge(){if(timeUp()){go('limit');return}challenge={score:0,combo:0,left:60,current:null,active:true};challengeQuestion();go('challenge');trackStart();timer=setInterval(()=>{if(page!=='challenge'||!challenge||!challenge.active){clearInterval(timer);return}challenge.left--;if(timeUp()||challenge.left<=0)finishChallenge();else {let clock=document.getElementById('challengeClock');if(clock)clock.textContent=challenge.left}},1000)}function challengeQuestion(){let open=state.villages.map((v,i)=>i).filter(i=>i===0||state.villages[i-1]>=15);let n=shuffle(open)[0]+2,a=Math.ceil(Math.random()*9);challenge.current={n,a,answer:n*a}}function challengePage(){if(!challenge){go('home');return}let q=challenge.current;shell(`<h1 class="title">⏱️ 60초 마법 챌린지</h1><div class="card center"><h2>⏳ <span id="challengeClock">${challenge.left}</span>초 · ⭐ ${challenge.score}개</h2><p>${challenge.combo>=3?'🔥 '+challenge.combo+' 콤보!':'힘내요! ✨'}</p><div class="question">${q.n} × ${q.a} = ?</div><input class="inputAnswer" id="challengeAnswer" readonly placeholder="숫자를 눌러요"><div class="keys">${[1,2,3,4,5,6,7,8,9,'←',0,'확인'].map(k=>`<button class="${k==='확인'?'ok':''}" onclick="challengeKey('${k}')">${k}</button>`).join('')}</div></div><button class="btn small" onclick="finishChallenge()">끝내기</button>`)}function challengeKey(k){let el=$('challengeAnswer');if(!el||!challenge.active)return;if(k==='확인'){if(!el.value)return;let q=challenge.current,correct=Number(el.value)===q.answer;let key=q.n+'x'+q.a;if(!state.stats[key])state.stats[key]={right:0,wrong:0};if(correct){challenge.score++;challenge.combo++;markCorrect(q.n,q.a);beep()}else{challenge.combo=0;state.stats[key].wrong++;beep(false)}challengeQuestion();render();return}el.value=k==='←'?el.value.slice(0,-1):(el.value+k).slice(0,3)}function finishChallenge(){if(!challenge||!challenge.active)return;challenge.active=false;clearInterval(timer);trackStop();let earned=challenge.score*5;state.stars+=earned;state.best=Math.max(state.best,challenge.score);save();modal=`<h2>⏰ 챌린지 완료!</h2><div style="font-size:65px">🏆</div><p>정답 ${challenge.score}개 · 별빛 +${earned}</p><p>최고 기록 ${state.best}개</p><button class="btn" onclick="modal='';go('home')">홈으로</button>`;render()}
function limitPage(){shell(`<div class="card center" style="margin-top:65px"><div style="font-size:90px">🌙🐼</div><h1>오늘의 마법 공부 끝!</h1><p>정말 잘했어요! 내일 또 만나자 💖</p><button class="btn pink" onclick="go('panda')">🐼 판다 돌보기</button><button class="btn purple" onclick="go('shop')">🎀 꾸미기</button></div>`)}
function parentGate(){parentA=20+Math.floor(Math.random()*60);parentB=10+Math.floor(Math.random()*30);modal=`<h2>🔐 부모님 화면</h2><p>보호자 확인: ${parentA} + ${parentB} = ?</p><input id="parentAnswer" type="number" inputmode="numeric" placeholder="정답"><button class="btn" onclick="checkParent()">확인</button><button class="btn small pink" onclick="modal='';render()">닫기</button>`;render()}function checkParent(){if(Number($('parentAnswer').value)===parentA+parentB){unlockParent=true;modal='';go('parent')}else{parentGate();pop('다시 풀어보세요')}}function parentPage(){if(!unlockParent){parentGate();return}let rescued=state.villages.filter(v=>v>=15).length;let stats=state.stats;let recent=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `${'일월화수목금토'[d.getDay()]}<div>${state.days.includes(key)?'🟢':'⚪'}</div>`});let weak=Object.entries(stats).filter(([k,v])=>v.wrong&&v.right<v.wrong+2).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,12);shell(`<h1 class="title">👨‍👩‍👧 부모님 화면</h1><div class="card"><h3>📊 학습 현황</h3><div class="stat">오늘 학습 시간: <b>${Math.floor(spent()/60)}분 ${spent()%60}초</b></div><div class="stat">오늘 정답: <b>${dailyCount()}개</b></div><div class="stat">연속 학습: <b>${streak()}일</b></div><div class="stat">구출한 마을: <b>${rescued}/8</b></div><div class="stat">챌린지 최고: <b>${state.best}개</b></div><h3>최근 7일</h3><div class="row center">${recent.map(x=>`<div>${x}</div>`).join('')}</div><h3>단별 정답률</h3>${Array.from({length:8},(_,i)=>{let n=i+2,entries=Object.entries(stats).filter(([k])=>k.startsWith(n+'x'));let r=entries.reduce((a,[,v])=>a+v.right,0),w=entries.reduce((a,[,v])=>a+v.wrong,0),pct=r+w?Math.round(r/(r+w)*100):0;return `<div class="stat">${n}단 ${pct}% (${r}/${r+w})<div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')}<h3>자주 틀리는 문제</h3>${weak.length?weak.map(([k,v])=>`<div class="stat">${k.replace('x',' × ')} · 오답 ${v.wrong}회 / 정답 ${v.right}회</div>`).join(''):'<p class="muted">아직 복습할 문제가 없어요.</p>'}</div><div class="card"><h3>⚙️ 설정</h3><p>하루 학습 시간 제한</p><select id="limit" onchange="state.limit=Number(this.value);save();render()">${[5,10,15,20,0].map(v=>`<option value="${v}" ${state.limit===v?'selected':''}>${v?v+'분':'제한 없음'}</option>`).join('')}</select><p>아이 이름</p><input id="childName" maxlength="15" value="${escapeHtml(state.child)}"><p>판다 이름</p><input id="pandaName" maxlength="15" value="${escapeHtml(state.panda)}"><button class="btn small green" onclick="saveNames()">이름 저장</button><p><label><input type="checkbox" ${state.sound?'checked':''} onchange="state.sound=this.checked;save()"> 효과음 켜기</label></p><button class="btn pink" onclick="confirmReset()">🗑️ 학습 기록 전체 초기화</button><button class="btn small" onclick="unlockParent=false;go('home')">부모님 화면 닫기</button></div>`)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveNames(){state.child=$('childName').value.trim()||'예온이';state.panda=$('pandaName').value.trim()||'뭉치';save();render()}function confirmReset(){resetArmed=false;modal=`<h2>⚠️ 기록 초기화</h2><p>학습·구매·성장 기록이 모두 사라집니다. 되돌릴 수 없어요.</p><button class="btn pink" onclick="resetStep()">1단계: 초기화 확인</button><button class="btn" onclick="modal='';render()">취소</button>`;render()}function resetStep(){resetArmed=true;modal=`<h2>정말 삭제할까요?</h2><p>두 번째 확인입니다. 모든 기록을 지웁니다.</p><button class="btn pink" onclick="resetAll()">2단계: 모든 기록 삭제</button><button class="btn" onclick="modal='';render()">취소</button>`;render()}function resetAll(){if(!resetArmed)return;trackStop();state=defaultState();save();unlockParent=false;modal='';page='home';render()}
function render(){if(page==='home')home();else if(page==='map')map();else if(page==='village')villagePage();else if(page==='quiz')quiz();else if(page==='chest')chest();else if(page==='result')result();else if(page==='panda')panda();else if(page==='shop')shopPage();else if(page==='challenge')challengePage();else if(page==='parent')parentPage();else if(page==='limit')limitPage();if(!state.story){modal=`<h2>🌟 판다 매직랜드에 오신 걸 환영해요!</h2><div style="font-size:75px">👧🏻🐼✨</div><p>평화롭던 판다 매직랜드에서 별빛이 사라져 대나무가 시들었어요. 배고픈 판다 뭉치와 마을에 갇힌 동물 친구들을 구해주세요!</p><p>예온이가 구구단 주문을 외우면 별빛과 대나무가 다시 살아난답니다.</p><button class="btn" onclick="state.story=true;save();modal='';render()">🪄 마법사가 될래요!</button>`;$('root').innerHTML=$('root').innerHTML.replace(/<div class="modalwrap">[\s\S]*?<\/div><\/div>$/,'');let wrap=document.createElement('div');wrap.className='modalwrap';wrap.innerHTML=`<div class="modal">${modal}</div>`;$('root').appendChild(wrap)}}
// Midnight reset is date-based; no network is used.
setInterval(()=>{if(page==='quiz'&&timeUp()){trackStop();go('limit')}if(page==='parent')render();if(streak()>=3&&!state.sibling){state.sibling=true;save()}},3000);document.addEventListener('visibilitychange',()=>{if(document.hidden)trackStop();else if(page==='quiz'||page==='challenge')trackStart()});window.addEventListener('beforeunload',trackStop);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
